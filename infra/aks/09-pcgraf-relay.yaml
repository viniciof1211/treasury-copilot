###############################################################################
# PcGraf SQL Server Relay via chisel reverse tunnel
#
# Architecture:
#   Your Machine (LAN) ── chisel client ──→ chisel server (this pod)
#     reverse-publishes 192.168.1.3:1433 as 0.0.0.0:1433 inside the pod
#
#   CDC Producer Pod ── connects to ── pcgraf-relay:1433 (K8s Service below)
#
# No router config, no VPN, no firewall changes needed.
# Only requires outbound HTTPS from your machine (port 8443).
###############################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: treasury-relay
  labels:
    app.kubernetes.io/part-of: treasury-copilot
---
# Secret for chisel auth (user:password)
apiVersion: v1
kind: Secret
metadata:
  name: chisel-auth
  namespace: treasury-relay
type: Opaque
stringData:
  # Format: user:password — used by both server and client
  AUTH: "treasury:Relay2026!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chisel-server
  namespace: treasury-relay
  labels:
    app: chisel-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chisel-server
  template:
    metadata:
      labels:
        app: chisel-server
    spec:
      containers:
        - name: chisel
          image: jpillora/chisel:latest
          args:
            - server
            - --port=8443
            - --reverse
            - --auth=$(AUTH)
          env:
            - name: AUTH
              valueFrom:
                secretKeyRef:
                  name: chisel-auth
                  key: AUTH
          ports:
            - containerPort: 8443
              name: chisel
              protocol: TCP
            - containerPort: 1433
              name: mssql
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 10
---
# Service for chisel server (external — your machine connects here)
apiVersion: v1
kind: Service
metadata:
  name: chisel-server
  namespace: treasury-relay
  labels:
    app: chisel-server
spec:
  type: LoadBalancer
  selector:
    app: chisel-server
  ports:
    - name: chisel
      port: 8443
      targetPort: 8443
      protocol: TCP
---
# Service for SQL Server relay (internal — CDC pods connect here)
# This resolves as pcgraf-relay.treasury-relay.svc.cluster.local:1433
apiVersion: v1
kind: Service
metadata:
  name: pcgraf-relay
  namespace: treasury-relay
  labels:
    app: chisel-server
spec:
  type: ClusterIP
  selector:
    app: chisel-server
  ports:
    - name: mssql
      port: 1433
      targetPort: 1433
      protocol: TCP
